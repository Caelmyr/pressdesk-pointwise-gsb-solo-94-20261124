name: solo97-pressdesk
services:
  desk:
    build:
      context: .
      args:
        PRESSDESK_RUNTIME_IMAGE: ${PRESSDESK_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${PRESSDESK_IMAGE:-solo97-pressdesk:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${PRESSDESK_PORT:-19897}:8000"
    volumes:
      - press-data:/var/lib/pressdesk
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/press/health', timeout=3).status == 200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  press-data:
